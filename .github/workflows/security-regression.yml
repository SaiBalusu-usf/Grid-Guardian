name: Security and ADK compatibility
on:
  pull_request:
  push:
    branches: ['fix/security-adk-migration-20261026']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USE_MOCK: 'true'
      AUTH_REQUIRED: 'false'
      GEMINI_API_KEY: ''
      ADMIN_API_KEY: ''
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python backend/build_adk_compat.py
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m pip check
      - run: python -m pytest -q tests/backend
